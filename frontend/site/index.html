<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мои дела</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Список дел</h1>
        <form id="task-form">
            <input type="text" id="task-title" placeholder="Название дела" required>
            <input type="text" id="task-desc" placeholder="Описание (необязательно)">
            <button type="submit">Добавить</button>
        </form>
        <ul id="task-list"></ul>
    </div>
    <script src="app.js"></script>
</body>
</html>
