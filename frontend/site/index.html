<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Календарь дел</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">
        <!-- Боковая панель -->
        <aside class="sidebar">
            <div class="logo">
                <h1>📅 Календарь дел</h1>
            </div>

            <!-- Мини-календарь -->
            <div class="mini-calendar">
                <div class="mini-calendar-header">
                    <button class="nav-btn" id="prev-month">←</button>
                    <span id="mini-month-year"></span>
                    <button class="nav-btn" id="next-month">→</button>
                </div>
                <div class="mini-calendar-grid" id="mini-calendar-days">
                    <div class="day-name">Пн</div>
                    <div class="day-name">Вт</div>
                    <div class="day-name">Ср</div>
                    <div class="day-name">Чт</div>
                    <div class="day-name">Пт</div>
                    <div class="day-name">Сб</div>
                    <div class="day-name">Вс</div>
                </div>
            </div>

            <!-- Легенда приоритетов -->
            <div class="priority-legend">
                <h3>Приоритеты</h3>
                <div class="legend-item">
                    <span class="legend-color" style="background: #FFF9C4;"></span>
                    <span>Низкий</span>
                </div>
                <div class="legend-item">
                    <span class="legend-color" style="background: #BBDEFB;"></span>
                    <span>Обычный</span>
                </div>
                <div class="legend-item">
                    <span class="legend-color" style="background: #E1BEE7;"></span>
                    <span>Высокий</span>
                </div>
                <div class="legend-item">
                    <span class="legend-color" style="background: #FFCDD2;"></span>
                    <span>Супер важно!</span>
                </div>
            </div>

            <!-- Кнопка добавления -->
            <div class="quick-add">
                <button class="add-task-btn" id="add-task-btn">
                    + Создать задачу
                </button>
            </div>
        </aside>

        <!-- Основная область -->
        <main class="main-content">
            <!-- Шапка -->
            <header class="main-header">
                <button class="today-btn" id="today-btn">Сегодня</button>
                <div class="date-navigator">
                    <button class="nav-btn" id="prev-period">←</button>
                    <h2 id="current-period"></h2>
                    <button class="nav-btn" id="next-period">→</button>
                </div>
                <div class="view-switcher">
                    <button class="view-btn active" data-view="week">Неделя</button>
                    <button class="view-btn" data-view="day">День</button>
                </div>
            </header>

            <!-- Вид "Неделя" — календарь -->
            <div class="calendar-container" id="calendar-container">
                <div class="week-header" id="week-header">
                    <div class="time-column-header"></div>
                </div>
                <div class="week-grid" id="week-grid">
                    <div class="time-column" id="time-column"></div>
                    <div class="days-container" id="days-container"></div>
                </div>
            </div>

            <!-- Вид "День" — список задач -->
            <div class="day-list-container" id="day-list-container" style="display: none;">
                <div class="day-list-header">
                    <h2 id="day-list-title"></h2>
                    <div class="day-stats" id="day-stats"></div>
                </div>
                <div class="day-list" id="day-list"></div>
            </div>
        </main>

        <!-- Модальное окно задачи -->
        <div class="modal" id="task-modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h3 id="modal-title">Новая задача</h3>
                    <button class="close-btn" id="close-modal">×</button>
                </div>
                <form id="task-form">
                    <input type="hidden" id="task-id">

                    <div class="form-group">
                        <input type="text"
                               id="task-title-input"
                               placeholder="Название задачи"
                               required
                               autocomplete="off">
                    </div>

                    <div class="form-group">
                        <textarea id="task-desc-input"
                                  placeholder="Описание"
                                  rows="3"></textarea>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>Дата</label>
                            <input type="date" id="task-date-input">
                        </div>
                        <div class="form-group">
                            <label>Время</label>
                            <select id="task-time-select">
                                <option value="">Весь день</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>Приоритет</label>
                            <select id="task-priority">
                                <option value="low">🟡 Низкий</option>
                                <option value="normal" selected>🔵 Обычный</option>
                                <option value="high">🟣 Высокий</option>
                                <option value="urgent">🔴 Супер важно!</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Цвет</label>
                            <input type="color" id="task-color" value="#BBDEFB">
                        </div>
                    </div>

                    <div class="form-actions">
                        <button type="button" class="btn-danger" id="delete-task-btn">
                            🗑 Удалить
                        </button>
                        <div class="form-actions-right">
                            <button type="button" class="btn-secondary" id="cancel-btn">
                                Отмена
                            </button>
                            <button type="submit" class="btn-primary">
                                Сохранить
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
